repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy strict
        entry: mypy --strict src
        language: system
        pass_filenames: false
        types: [python]
