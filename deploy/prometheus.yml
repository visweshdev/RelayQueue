global:
  scrape_interval: 5s
scrape_configs:
  - job_name: api
    static_configs:
      - targets: [api:8000]
  - job_name: reaper
    static_configs:
      - targets: [reaper:9100]
  - job_name: workers
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
        refresh_interval: 5s
