name: relayqueue-secure
x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: relayqueue:secure
  restart: unless-stopped
  environment: &environment
    DATABASE_URL_FILE: /run/secrets/database_url
    REDIS_URL_FILE: /run/secrets/redis_url
    AUTH_POLICY_FILE: /run/secrets/auth_policy
    SECURE_MODE: "true"
    QUEUES: alpha,beta
    API_WORKERS: "2"
  secrets: [database_url, redis_url, auth_policy]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}
services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relayqueue
      POSTGRES_DB: relayqueue
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U relayqueue -d relayqueue"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    restart: unless-stopped
    image: redis:7.4-alpine
    entrypoint: [sh, -ec]
    command: ['exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"']
    secrets: [redis_password]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    restart: "no"
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 4s
      retries: 30
  worker:
    <<: *app
    command: [python, -m, relayqueue.worker.worker]
    deploy: {replicas: 2}
    stop_grace_period: 40s
  reaper:
    <<: *app
    command: [python, -m, relayqueue.reaper.reaper]
  retention:
    <<: *app
    command: [sh, -ec, "while true; do python -m relayqueue.retention --days 30 --limit 1000 --apply; sleep 86400; done"]
  gateway:
    restart: unless-stopped
    image: caddy:2.10-alpine
    ports: ["127.0.0.1:8443:443"]
    volumes: ["./Caddyfile.local:/etc/caddy/Caddyfile:ro", "caddy-data:/data"]
    depends_on:
      api: {condition: service_healthy}
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.0.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./prometheus.secure.yml:/etc/prometheus/prometheus.yml:ro", "./alerts.yml:/etc/prometheus/alerts.yml:ro"]
  alertmanager:
    restart: unless-stopped
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/config.yml"]
    volumes: ["./alertmanager.yml:/etc/alertmanager/config.yml:ro"]
  alert-receiver:
    restart: unless-stopped
    image: python:3.12-slim
    command: [python, /app/alert_receiver.py]
    volumes: ["./alert_receiver.py:/app/alert_receiver.py:ro", "alert-events:/events"]
secrets:
  postgres_password: {file: ../.secrets/postgres_password}
  redis_password: {file: ../.secrets/redis_password}
  database_url: {file: ../.secrets/database_url}
  redis_url: {file: ../.secrets/redis_url}
  auth_policy: {file: ../.secrets/auth_policy.json}
volumes:
  postgres-data:
  redis-data:
  caddy-data:
  alert-events:
