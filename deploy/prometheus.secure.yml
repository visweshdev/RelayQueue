global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: api
    static_configs:
      - targets: [api:8000]
  - job_name: reaper
    static_configs:
      - targets: [reaper:9100]
  - job_name: workers
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
