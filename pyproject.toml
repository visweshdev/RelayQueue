[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "forgequeue"
version = "0.1.0"
description = "A PostgreSQL-authoritative distributed job queue with Redis leases"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "SQLAlchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2", "redis>=5.2,<6",
  "structlog>=24.4,<26", "prometheus-client>=0.21,<1", "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "pytest-cov>=6,<7",
       "testcontainers[postgres,redis]>=4.9,<5", "ruff>=0.9,<1",
       "mypy>=1.14,<2", "locust>=2.32,<3", "matplotlib>=3.9,<4",
       "psutil>=6,<8", "types-psutil", "pre-commit>=4,<5"]

[project.scripts]
forgequeue-worker = "forgequeue.worker.worker:main"
forgequeue-reaper = "forgequeue.reaper.reaper:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forgequeue"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache", ".uv-clean", ".venv", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: real PostgreSQL and Redis", "chaos: Docker process failure tests", "slow: long running test"]

[tool.coverage.run]
source = ["forgequeue"]
branch = true

[tool.coverage.report]
show_missing = true
