name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - run: ruff check src tests bench migrations && ruff format --check src tests bench migrations
      - run: mypy --strict src
      - run: pytest tests/unit tests/integration --cov=relayqueue --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - run: docker compose config --quiet
      - run: docker build -f deploy/Dockerfile -t relayqueue:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: npm run test:browser
      - name: Capture container logs
        if: always()
        run: |
          mkdir -p output/browser-checks
          docker compose logs --no-color > output/browser-checks/containers.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: output/browser-checks/
      - name: Stop isolated CI stack
        if: always()
        run: docker compose down --volumes
