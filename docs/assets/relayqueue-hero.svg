<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
<title id="title">RelayQueue — Persistent jobs. Visible progress.</title>
<desc id="desc">A distributed Python job queue. A schematic shows accepted jobs moving through workers to completed results.</desc>
