<rect width="1200" height="370" rx="18" fill="url(#bg)"/><rect width="1200" height="370" rx="18" fill="url(#grid)"/>
<g font-family="Segoe UI,Arial,sans-serif">
<rect x="52" y="52" width="42" height="42" rx="11" fill="#557eff"/><g stroke="#fff" stroke-width="3" fill="none"><path d="M62 66q5-5 11 0t11 0M62 74q5-5 11 0t11 0M62 82q5-5 11 0t11 0"/></g>
